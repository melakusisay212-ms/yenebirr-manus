name: Build Android APK with native CSV export

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Apply native CSV export integration
        run: |
          test -f capacitor-native-file-export/apply.cjs
          node capacitor-native-file-export/apply.cjs

      - name: Build web assets
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install existing repository launcher icons
        run: |
          RES=android/app/src/main/res

          test -d public/icons
          test -f public/icons/icon-48.png
          test -f public/icons/icon-72.png
          test -f public/icons/icon-96.png
          test -f public/icons/icon-144.png
          test -f public/icons/icon-192.png

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          cp public/icons/icon-48.png \
            "$RES/mipmap-mdpi/ic_launcher.png"

          cp public/icons/icon-48.png \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp public/icons/icon-72.png \
            "$RES/mipmap-hdpi/ic_launcher.png"

          cp public/icons/icon-72.png \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp public/icons/icon-96.png \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          cp public/icons/icon-96.png \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp public/icons/icon-144.png \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp public/icons/icon-144.png \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp public/icons/icon-192.png \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp public/icons/icon-192.png \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          # Remove generated adaptive placeholders that may override the PNG icons.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)

          test -n "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

          echo "Found APK:"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yenebirr-debug-apk-native-csv
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload tagged APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: yenebirr-${{ github.ref_name }}-native-csv-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
